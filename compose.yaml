services:
  harbournow:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - harbour-data:/data
      - ./config/harbours.json:/app/config/harbours.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 80
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  harbour-data:
